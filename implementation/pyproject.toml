[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puls_sched"
version = "0.1.0"
description = "PULS scheduler reference implementation"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "rhydcdc", email = "rhy030218@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
